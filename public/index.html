<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Secure Wallet — Anti-Drain Protection</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0e1a;
    color: #e0e6ed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container { max-width: 520px; width: 95%; padding: 20px; }
  .card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 16px;
  }
  .logo { text-align: center; margin-bottom: 20px; }
  .logo h1 { font-size: 1.6rem; color: #22d3ee; }
  .logo p { color: #6b7280; font-size: 0.9rem; margin-top: 4px; }
  .input-group { margin-bottom: 16px; }
  label { display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 6px; }
  input, textarea, select {
    width: 100%;
    padding: 12px 14px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 10px;
    color: #e0e6ed;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus { border-color: #22d3ee; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: #22d3ee; color: #0a0e1a; }
  .btn-primary:hover { background: #06b6d4; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }
  .btn-secondary { background: #374151; color: white; }
  .btn-secondary:hover { background: #4b5563; }
  .hidden { display: none !important; }
  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  .alert-success { background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
  .alert-error { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
  .alert-warning { background: #451a03; color: #fcd34d; border: 1px solid #78350f; }
  .address-box {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px;
    font-family: monospace;
    font-size: 0.9rem;
    word-break: break-all;
    text-align: center;
    margin-bottom: 12px;
  }
  .balance-display {
    text-align: center;
    padding: 20px;
  }
  .balance-display .amount { font-size: 2.2rem; font-weight: 700; color: #22d3ee; }
  .balance-display .label { color: #6b7280; font-size: 0.9rem; }
  .mnemonic-box {
    background: #1a0f00;
    border: 1px solid #78350f;
    border-radius: 10px;
    padding: 16px;
    color: #fcd34d;
    font-family: monospace;
    word-break: break-all;
    margin-bottom: 12px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    background: #1f2937;
    color: #9ca3af;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .tab.active { background: #22d3ee; color: #0a0e1a; }
  .tx-item {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    font-size: 0.85rem;
  }
  .tx-item .hash { color: #22d3ee; font-family: monospace; }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid #22d3ee;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">

  <!-- Logo -->
  <div class="logo">
    <h1>🔐 Secure Wallet</h1>
    <p>Even if your seed leaks, your funds stay safe</p>
  </div>

  <!-- Alert Container -->
  <div id="alertBox"></div>

  <!-- ─── NO WALLET SCREEN ─── -->
  <div id="noWalletScreen" class="card hidden">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('create')">Create New</div>
      <div class="tab" onclick="switchTab('recover')">Recover</div>
    </div>

    <!-- Create -->
    <div id="createTab">
      <div class="input-group">
        <label>🔒 Secondary Password (min 8 chars)</label>
        <input type="password" id="createPassword" placeholder="This password protects ALL transactions">
      </div>
      <div class="input-group">
        <label>Confirm Secondary Password</label>
        <input type="password" id="createPassword2" placeholder="Re-enter password">
      </div>
      <button class="btn btn-primary" onclick="createWallet()">Create Secure Wallet</button>
    </div>

    <!-- Recover -->
    <div id="recoverTab" class="hidden">
      <div class="input-group">
        <label>📝 Seed Phrase (12 words)</label>
        <textarea id="recoverMnemonic" rows="3" placeholder="Enter your 12-word seed phrase..."></textarea>
      </div>
      <div class="input-group">
        <label>🔒 New Secondary Password (min 8 chars)</label>
        <input type="password" id="recoverPassword" placeholder="Set a new secondary password">
      </div>
      <button class="btn btn-primary" onclick="recoverWallet()">Recover Wallet</button>
    </div>
  </div>

  <!-- ─── MNEMONIC BACKUP SCREEN ─── -->
  <div id="backupScreen" class="card hidden">
    <div class="alert alert-warning">⚠️ WRITE THIS DOWN NOW. This is the ONLY way to recover your wallet.</div>
    <div class="mnemonic-box" id="mnemonicDisplay"></div>
    <div class="address-box" id="backupAddress"></div>
    <button class="btn btn-primary" onclick="finishBackup()">I've Saved My Seed Phrase</button>
  </div>

  <!-- ─── WALLET DASHBOARD ─── -->
  <div id="walletScreen" class="card hidden">
    <div class="balance-display">
      <div class="amount" id="balanceAmount">0.0000</div>
      <div class="label">ETH</div>
    </div>
    <div class="address-box" id="walletAddress"></div>

    <div class="tabs">
      <div class="tab active" onclick="switchWalletTab('send')">Send</div>
      <div class="tab" onclick="switchWalletTab('history')">History</div>
      <div class="tab" onclick="switchWalletTab('settings')">Settings</div>
    </div>

    <!-- Send -->
    <div id="sendTab">
      <div class="input-group">
        <label>Recipient Address</label>
        <input type="text" id="sendTo" placeholder="0x...">
      </div>
      <div class="input-group">
        <label>Amount (ETH)</label>
        <input type="number" id="sendAmount" placeholder="0.01" step="0.0001" min="0">
      </div>
      <div class="input-group">
        <label>🔒 Secondary Password (REQUIRED to sign)</label>
        <input type="password" id="sendPassword" placeholder="Enter your secondary password">
      </div>
      <button class="btn btn-primary" onclick="sendTransaction()">Send Transaction</button>
    </div>

    <!-- History -->
    <div id="historyTab" class="hidden">
      <div id="txHistoryList"><p style="color:#6b7280;text-align:center;">No transactions yet</p></div>
    </div>

    <!-- Settings -->
    <div id="settingsTab" class="hidden">
      <div class="input-group">
        <label>RPC URL</label>
        <input type="text" id="rpcUrl" value="https://eth.llamarpc.com">
      </div>
      <div class="input-group">
        <label>Chain ID</label>
        <input type="number" id="chainId" value="1">
      </div>
      <button class="btn btn-secondary" onclick="saveSettings()">Save Settings</button>
      <hr style="border-color:#30363d;margin:20px 0;">
      <button class="btn btn-danger" onclick="deleteWallet()">Delete Wallet</button>
    </div>
  </div>

</div>

<script>
let currentWallet = null;

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alertBox');
  box.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => box.innerHTML = '', 6000);
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('createTab').classList.toggle('hidden', tab !== 'create');
  document.getElementById('recoverTab').classList.toggle('hidden', tab !== 'recover');
}

function switchWalletTab(tab) {
  document.querySelectorAll('#walletScreen .tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('sendTab').classList.toggle('hidden', tab !== 'send');
  document.getElementById('historyTab').classList.toggle('hidden', tab !== 'history');
  document.getElementById('settingsTab').classList.toggle('hidden', tab !== 'settings');
  if (tab === 'history') loadTxHistory();
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ─── Check wallet on load ───
async function init() {
  try {
    const info = await api('GET', '/api/wallet');
    if (info.exists) {
      currentWallet = info;
      showWalletScreen();
      refreshBalance();
    } else {
      document.getElementById('noWalletScreen').classList.remove('hidden');
    }
  } catch (e) {
    showAlert(e.message);
    document.getElementById('noWalletScreen').classList.remove('hidden');
  }
}

// ─── Create ───
async function createWallet() {
  const pw = document.getElementById('createPassword').value;
  const pw2 = document.getElementById('createPassword2').value;
  if (pw.length < 8) return showAlert('Password must be at least 8 characters');
  if (pw !== pw2) return showAlert('Passwords do not match');

  try {
    const data = await api('POST', '/api/wallet/create', { secondaryPassword: pw });
    document.getElementById('mnemonicDisplay').textContent = data.mnemonic;
    document.getElementById('backupAddress').textContent = data.address;
    document.getElementById('noWalletScreen').classList.add('hidden');
    document.getElementById('backupScreen').classList.remove('hidden');
  } catch (e) {
    showAlert(e.message);
  }
}

function finishBackup() {
  document.getElementById('backupScreen').classList.add('hidden');
  showWalletScreen();
  refreshBalance();
}

// ─── Recover ───
async function recoverWallet() {
  const mnemonic = document.getElementById('recoverMnemonic').value.trim();
  const pw = document.getElementById('recoverPassword').value;
  if (!mnemonic) return showAlert('Enter your seed phrase');
  if (pw.length < 8) return showAlert('Password must be at least 8 characters');

  try {
    await api('POST', '/api/wallet/recover', { mnemonic, secondaryPassword: pw });
    showAlert('Wallet recovered successfully!', 'success');
    document.getElementById('noWalletScreen').classList.add('hidden');
    showWalletScreen();
    refreshBalance();
  } catch (e) {
    showAlert(e.message);
  }
}

// ─── Dashboard ───
function showWalletScreen() {
  document.getElementById('walletScreen').classList.remove('hidden');
  document.getElementById('walletAddress').textContent = currentWallet?.address || '';
}

async function refreshBalance() {
  try {
    const data = await api('GET', '/api/balance');
    document.getElementById('balanceAmount').textContent = parseFloat(data.balance).toFixed(4);
    currentWallet = { ...currentWallet, ...data };
  } catch (e) {
    console.error('Balance refresh failed:', e.message);
  }
}

// ─── Send ───
async function sendTransaction() {
  const to = document.getElementById('sendTo').value.trim();
  const amount = document.getElementById('sendAmount').value;
  const password = document.getElementById('sendPassword').value;

  if (!to || !amount || !password) return showAlert('Fill all fields');
  if (!/^0x[a-fA-F0-9]{40}$/.test(to)) return showAlert('Invalid Ethereum address');
  if (parseFloat(amount) <= 0) return showAlert('Amount must be > 0');

  const btn = event.target;
  const originalText = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> Signing...';
  btn.disabled = true;

  try {
    const result = await api('POST', '/api/send', { to, amount, secondaryPassword: password });
    showAlert(`✅ Sent! Hash: ${result.hash.slice(0, 20)}...`, 'success');
    document.getElementById('sendTo').value = '';
    document.getElementById('sendAmount').value = '';
    document.getElementById('sendPassword').value = '';
    setTimeout(refreshBalance, 3000);
  } catch (e) {
    showAlert(e.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

// ─── History ───
async function loadTxHistory() {
  try {
    const logs = await api('GET', '/api/tx-history');
    const list = document.getElementById('txHistoryList');
    if (!logs.length) {
      list.innerHTML = '<p style="color:#6b7280;text-align:center;">No transactions yet</p>';
      return;
    }
    list.innerHTML = logs.slice().reverse().map(tx => `
      <div class="tx-item">
        <div><span class="hash">${tx.hash?.slice(0, 20)}...</span> → ${tx.to?.slice(0, 12)}...</div>
        <div>${tx.amount} ETH | ${tx.status} | ${new Date(tx.timestamp).toLocaleString()}</div>
      </div>
    `).join('');
  } catch (e) {
    console.error('History load failed:', e.message);
  }
}

// ─── Settings ───
async function saveSettings() {
  const rpc = document.getElementById('rpcUrl').value;
  const chain = document.getElementById('chainId').value;
  try {
    await api('POST', '/api/settings', { rpcUrl: rpc, chainId: Number(chain) });
    showAlert('Settings saved', 'success');
  } catch (e) {
    showAlert(e.message);
  }
}

async function deleteWallet() {
  if (!confirm('⚠️ DELETE wallet? Your seed phrase will be needed to recover.\n\nThis cannot be undone.')) return;
  try {
    await api('POST', '/api/wallet/delete');
    showAlert('Wallet deleted', 'success');
    location.reload();
  } catch (e) {
    showAlert(e.message);
  }
}

// Auto-refresh balance every 15s
setInterval(() => {
  if (currentWallet) refreshBalance();
}, 15000);

init();
</script>
</body>
</html>
